services:
  isle-economy:
    build: .
    container_name: isle-economy
    restart: unless-stopped
    env_file: runtime.env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3020:3020"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
